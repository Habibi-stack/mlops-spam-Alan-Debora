<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Classificador de spam</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">MLOps e Deploy</p>
        <h1>Classificador de spam</h1>
      </div>
      <div class="badges">
        <span id="versionBadge" class="badge">versão —</span>
        <span id="envBadge" class="badge">amb: —</span>
        <span id="healthBadge" class="badge">Verificando serviço</span>
      </div>
    </header>

    <section class="grid">
      <div class="panel">
        <label for="apiKey">Chave de API (X-API-Key)</label>
        <input id="apiKey" type="password" placeholder="Digite a chave configurada no .env">

        <label for="message">Mensagem</label>
        <textarea id="message" rows="7" placeholder="Digite ou cole aqui a mensagem para analisar..."></textarea>

        <div class="actions">
          <button id="classifyBtn" type="button">Classificar</button>
          <button id="spamBtn" class="secondary" type="button">Ex. spam</button>
          <button id="commonBtn" class="secondary" type="button">Ex. comum</button>
        </div>
      </div>

      <aside class="panel result-panel">
        <p class="eyebrow">Resultado</p>
        <div id="resultLabel" class="result-label">Aguardando</div>
        <p id="resultVersion" class="muted">respondido pela —</p>

        <div class="probability-head">
          <span>Probabilidade</span>
          <strong id="probabilityValue">—</strong>
        </div>
        <div class="bar"><div id="probabilityBar" class="bar-fill"></div></div>

        <div id="errorBox" class="error" role="alert" hidden></div>
      </aside>
    </section>

    <!-- Painel de operação da Etapa 4 (Observabilidade - Slides 25, 27 e 51) -->
    <section class="panel operation-panel">
      <div class="operation-header">
        <h2>Painel de operação</h2>
        <button id="loadBtn" class="secondary" type="button">Enviar 50 requisições</button>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Requisições</span>
          <strong id="metricRequests" class="metric-value">0</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">Erros 5xx</span>
          <strong id="metricErrors" class="metric-value">0</strong>
        </div>
        <div class="metric-card">
          <span class="metric-label">Latência média</span>
          <strong id="metricLatency" class="metric-value">0 ms</strong>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
