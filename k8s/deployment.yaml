apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-service
  labels:
    app: spam-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: spam-service
  template:
    metadata:
      labels:
        app: spam-service
    spec:
      containers:
        - name: api
          image: spam-service:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "test"
            - name: MODEL_VERSION
              value: "v2"
            # Em produção, substitua por um Secret do Kubernetes (secretKeyRef)
            - name: API_KEY
              value: "chave-ficticia-123"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
