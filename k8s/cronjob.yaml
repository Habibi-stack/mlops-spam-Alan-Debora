apiVersion: batch/v1
kind: CronJob
metadata:
  name: verificar-saude
  labels:
    app: spam-service
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: checar
              image: curlimages/curl:8.11.1
              args:
                - "-fsS"
                - "http://spam-service/health"
              resources:
                requests:
                  cpu: "25m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
